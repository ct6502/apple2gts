# Publishes the prebuilt site that apple2ts pushes to the gh-pages branch.
# The site is built in ct6502/apple2ts and copied here; nothing is compiled
# in this repository.

name: Deploy GitHub Pages

on:
  push:
    branches: [ gh-pages ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
    - uses: actions/checkout@v7
      with:
        ref: gh-pages
    - name: Setup GitHub Pages
      uses: actions/configure-pages@v6
    - name: Upload GitHub Pages artifact
      uses: actions/upload-pages-artifact@v4
      with:
        path: .
    - name: Deploy GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v4
